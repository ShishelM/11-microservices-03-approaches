version: '3.8'

services:
  # === ОРИГИНАЛЬНЫЕ СЕРВИСЫ ИЗ ПРЕДЫДУЩЕГО ДЗ (11-microservices-02) ===
  security-service:
    build: ./security-service
    container_name: security-service
    logging:
      driver: "json-file"
    ports:
      - "8080:8080" 
    networks:
      default:
        aliases:
          - security

  uploader-service:
    build: ./uploader-service
    container_name: uploader-service
    logging:
      driver: "json-file"
    ports:
      - "8083:8080" 
    networks:
      default:
        aliases:
          - uploader

  minio:
    image: minio/minio:RELEASE.2023-05-18T00-05-36Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"

  gateway:
    image: nginx:latest
    container_name: gateway
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80" 
    depends_on:
      - security-service
      - uploader-service
      - minio

  # === ДОПОЛНЕНИЕ: СТЭК СБОРА И АНАЛИЗА ЛОГОВ (ЗАДАЧА 4) ===
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=qwerty123456
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.10
    container_name: kibana
    environment:
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=qwerty123456
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  vector:
    image: timberio/vector:0.30.0-debian
    container_name: vector
    volumes:
      - ./vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - elasticsearch

  # === ДОПОЛНЕНИЕ: СТЭК МОНИТОРИНГА И ВИЗУАЛИЗАЦИИ (ЗАДАЧА 5) ===
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8082:8080"

  grafana:
    image: grafana/grafana:9.5.3
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=qwerty123456
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  minio_data:
